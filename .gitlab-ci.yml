stages:
  - test
  - build
  - release

variables:
  GO_VERSION: "1.25.11"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  XPKG_REG_IMAGE: "$CI_REGISTRY_IMAGE/provider-dynatrace-native"

default:
  image: golang:1.24-alpine
  before_script:
    - apk add --no-cache bash make git curl docker-cli

unit_tests:
  stage: test
  script:
    - go test -v ./...

integration_tests:
  stage: test
  rules:
    - if: '$DT_CLIENT_ID && $DT_CLIENT_SECRET && $DT_ACCOUNT_ID'
  script:
    - go test -tags=integration -v ./test/integration/...

build_binary:
  stage: build
  script:
    - go build -o bin/provider ./cmd/provider
  artifacts:
    paths:
      - bin/provider

build_package:
  stage: build
  image: docker:25-cli
  services:
    - docker:25-dind
  before_script:
    - apk add --no-cache bash make git curl golang
    - curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | CHANNEL=stable bash
    - mv crossplane /usr/local/bin/
  script:
    - make generate
    - make build
  artifacts:
    paths:
      - _output/
      - package/crds/

release_xpkg:
  stage: release
  image: docker:25-cli
  services:
    - docker:25-dind
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash make git curl golang
    - curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | CHANNEL=stable bash
    - mv crossplane /usr/local/bin/
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - make build
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "Publishing provider package version $TAG to $XPKG_REG_IMAGE:$TAG..."
    # Build and push container & xpkg
    - docker build -t "${XPKG_REG_IMAGE}:${TAG}" -f cluster/images/provider-dynatrace-native/Dockerfile .
    - docker push "${XPKG_REG_IMAGE}:${TAG}"
    - crossplane xpkg build --package-root=package --embed-runtime-image="${XPKG_REG_IMAGE}:${TAG}" --output=_output/provider-dynatrace-native-${TAG}.xpkg
    - crossplane xpkg push --package=_output/provider-dynatrace-native-${TAG}.xpkg "${XPKG_REG_IMAGE}:${TAG}"
