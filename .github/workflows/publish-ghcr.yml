name: Publish to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the published package (e.g. v0.1.0 or latest)'
        required: false
        default: 'latest'

env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | CHANNEL=stable bash
          sudo mv crossplane /usr/local/bin/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build Provider Binary (Linux amd64 & arm64)
        run: |
          mkdir -p _output/bin/linux_amd64 _output/bin/linux_arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o _output/bin/linux_amd64/provider ./cmd/provider
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o _output/bin/linux_arm64/provider ./cmd/provider

      - name: Build and Push Multi-arch Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cluster/images/provider-dynatrace-native/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and Push Crossplane Package (.xpkg)
        run: |
          # Determine the primary tag to use for the Crossplane package
          PRIMARY_TAG="${{ steps.meta.outputs.version }}"
          if [ -z "${PRIMARY_TAG}" ]; then
            if [ "${{ github.ref_name }}" == "main" ]; then
              PRIMARY_TAG="latest"
            else
              PRIMARY_TAG="${{ github.ref_name }}"
            fi
          fi
          
          PACKAGE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PRIMARY_TAG}"
          echo "Building Crossplane package for image: ${PACKAGE_IMAGE}"
          
          mkdir -p _output/package
          crossplane xpkg build \
            --package-root=package \
            --embed-runtime-image="${PACKAGE_IMAGE}" \
            --output="_output/package/provider-dynatrace-native-${PRIMARY_TAG}.xpkg"

          echo "Pushing Crossplane package to GHCR..."
          crossplane xpkg push \
            --package="_output/package/provider-dynatrace-native-${PRIMARY_TAG}.xpkg" \
            "${PACKAGE_IMAGE}"
